<div class="min-h-[100dvh] grid place-items-center p-4 sm:p-8
            bg-gradient-to-br from-surface-50 via-primary-50 to-surface-100
            dark:from-surface-950 dark:via-surface-900 dark:to-surface-950
            relative overflow-hidden transition-colors duration-300">

  <!-- Decorative blobs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-[500px] h-[500px] rounded-full blur-3xl
                bg-primary-400/10 dark:bg-primary-600/10"></div>
    <div class="absolute -bottom-40 -left-40 w-[500px] h-[500px] rounded-full blur-3xl
                bg-accent-400/10 dark:bg-accent-600/8"></div>
  </div>

  <!-- Theme toggle (Fixed top right, subtle and elegant) -->
  <button
    (click)="themeService.toggleTheme()"
    class="fixed top-4 right-4 sm:top-6 sm:right-6 z-50 p-2.5 rounded-full
           bg-white/60 dark:bg-surface-800/60 backdrop-blur-md
           border border-surface-200 dark:border-surface-700
           text-surface-500 dark:text-surface-400
           hover:bg-white dark:hover:bg-surface-700
           hover:text-surface-800 dark:hover:text-surface-200
           shadow-sm transition-all duration-200 cursor-pointer"
    aria-label="Alternar modo oscuro"
  >
    @if (themeService.theme() === 'dark') {
      <!-- Sol -->
      <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
    } @else {
      <!-- Luna -->
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
      </svg>
    }
  </button>

  <!-- Centered content wrapper -->
  <div class="relative z-10 w-full max-w-md flex flex-col items-center space-y-8">

    <!-- Logo / Brand -->
    <div class="text-center flex flex-col items-center">
      <div class="flex items-center justify-center w-16 h-16 rounded-2xl
                  bg-gradient-to-br from-primary-500 to-primary-700
                  shadow-lg shadow-primary-500/25 mb-5">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-surface-800 dark:text-white tracking-tight">DocentoApp</h1>
      <p class="mt-2 text-sm text-surface-500 dark:text-surface-400">Plataforma para profesores de FP</p>
    </div>

    <!-- Login Card -->
    <div class="w-full bg-white dark:bg-surface-900/80 backdrop-blur-xl
                border border-surface-200 dark:border-surface-800
                rounded-2xl shadow-xl shadow-surface-900/5 dark:shadow-black/30
                p-8 transition-colors duration-300">

      <h2 class="text-xl font-semibold text-surface-800 dark:text-white mb-6 text-center">
        Iniciar sesión
      </h2>

      <!-- Error message -->
      @if (errorMessage) {
        <div class="mb-6 flex items-start gap-3
                    bg-red-50 dark:bg-red-500/10
                    border border-red-200 dark:border-red-500/20
                    text-red-600 dark:text-red-300
                    text-sm rounded-xl px-4 py-3">
          <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <!-- Email/Password Form -->
      <form (ngSubmit)="onEmailLogin()" class="space-y-5">

        <!-- Email field -->
        <div>
          <label for="email" class="block text-sm font-medium text-surface-600 dark:text-surface-300 mb-2">
            Correo electrónico
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-surface-400 dark:text-surface-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
              </svg>
            </div>
            <input
              id="email"
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="profesor@centro.edu"
              autocomplete="email"
              class="w-full pl-11 pr-4 py-3
                     bg-surface-50 dark:bg-surface-800
                     border border-surface-200 dark:border-surface-700
                     rounded-xl text-surface-800 dark:text-white
                     placeholder-surface-400 dark:placeholder-surface-500
                     text-sm
                     focus:outline-none focus:ring-2 focus:ring-primary-500/40 focus:border-primary-500
                     dark:focus:ring-primary-400/40 dark:focus:border-primary-400
                     transition-all duration-200"
            />
          </div>
        </div>

        <!-- Password field -->
        <div>
          <label for="password" class="block text-sm font-medium text-surface-600 dark:text-surface-300 mb-2">
            Contraseña
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-surface-400 dark:text-surface-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
              </svg>
            </div>
            <input
              id="password"
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="w-full pl-11 pr-4 py-3
                     bg-surface-50 dark:bg-surface-800
                     border border-surface-200 dark:border-surface-700
                     rounded-xl text-surface-800 dark:text-white
                     placeholder-surface-400 dark:placeholder-surface-500
                     text-sm
                     focus:outline-none focus:ring-2 focus:ring-primary-500/40 focus:border-primary-500
                     dark:focus:ring-primary-400/40 dark:focus:border-primary-400
                     transition-all duration-200"
            />
          </div>
        </div>

        <!-- Submit button -->
        <button
          type="submit"
          [disabled]="isLoading"
          class="w-full flex items-center justify-center gap-2 py-3 px-4 mt-2
                 bg-gradient-to-r from-primary-500 to-primary-700
                 hover:from-primary-400 hover:to-primary-600
                 text-white font-medium text-sm rounded-xl
                 shadow-lg shadow-primary-500/25
                 focus:outline-none focus:ring-2 focus:ring-primary-500/50 focus:ring-offset-2
                 focus:ring-offset-white dark:focus:ring-offset-surface-900
                 disabled:opacity-50 disabled:cursor-not-allowed
                 transition-all duration-200 cursor-pointer"
        >
          @if (isLoading) {
            <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
          }
          <span>{{ isLoading ? 'Iniciando sesión...' : 'Iniciar sesión' }}</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-surface-200 dark:border-surface-700"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="bg-white dark:bg-surface-900/80 px-3 text-surface-400 dark:text-surface-500">
            o continúa con
          </span>
        </div>
      </div>

      <!-- Google button -->
      <button
        (click)="onGoogleLogin()"
        [disabled]="isLoading"
        type="button"
        class="w-full flex items-center justify-center gap-3 py-3 px-4
               bg-surface-50 dark:bg-surface-800 hover:bg-surface-100 dark:hover:bg-surface-700
               border border-surface-200 dark:border-surface-700
               text-surface-700 dark:text-surface-200
               font-medium text-sm rounded-xl
               focus:outline-none focus:ring-2 focus:ring-surface-300 dark:focus:ring-surface-600
               focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-surface-900
               disabled:opacity-50 disabled:cursor-not-allowed
               transition-all duration-200 cursor-pointer"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Iniciar sesión con Google</span>
      </button>

    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-surface-400 dark:text-surface-500">
      DocentoApp &copy; {{ currentYear }} · Plataforma educativa para FP
    </p>

  </div>
</div>
